name: Setup-SolarFiles Builder
on:
  push:
    branches:
      - 'python'
  pull_request:
    branches:
      - 'python'
  workflow_dispatch:

env:
    pythonVersion: 3.14.3

jobs:
    build:
        name: Build for ${{ matrix.os-name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
              include:
                - os: ubuntu-latest
                  os-name: Linux Ubuntu
                  artifact-path: dist/Setup-SolarFiles-Linux
                  artifact-name: Setup-SolarFiles-Linux
                - os: windows-latest
                  os-name: Windows
                  artifact-path: dist/Setup-SolarFiles-Windows.exe
                  artifact-name: Setup-SolarFiles-Windows
                - os: macos-latest
                  os-name: macOS
                  artifact-path: dist/Setup-SolarFiles-macOS
                  artifact-name: Setup-SolarFiles-macOS
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Set up Python ${{ env.pythonVersion }}
            uses: actions/setup-python@v4
            with:
              python-version: ${{ env.pythonVersion }}
          
          - name: Install Python dependencies
            run: pip install -r requirements.txt
          
          - name: Compile with PyInstaller
            run: pyinstaller --onefile --name Setup-SolarFiles

          - name: Rename Build (Windows)
            if: runner.os == 'Windows'
            run: move dist\Setup-SolarFiles.exe ${{ matrix.artifact-path }}

          - name: Rename Build (Linux/macOS)
            if: runner.os != 'Windows'
            run: mv dist/Setup-SolarFiles ${{ matrix.artifact-path }}

          - name: Upload Build Artifact
            uses: actions/upload-artifact@v4
            with:
              name: ${{ matrix.artifact-name }}
              path: ${{ matrix.artifact-path }}